<!-- src/main/resources/templates/layout.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">Billable</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        .flash { padding: 0.75rem 1rem; }
        .flash-success { border-left: 0.35rem solid #2e7d32; }
        .flash-error { border-left: 0.35rem solid #c62828; }
    </style>
</head>
<body>

<header class="container">
    <nav>
        <ul>
            <li><strong>Billable</strong></li>
        </ul>
        <ul>
            <li><a th:href="@{/}">Home</a></li>
            <li><a th:href="@{/clients}">Clients</a></li>
            <li><a th:href="@{/about}">About</a></li>
        </ul>
    </nav>
</header>

<div class="container" th:if="${timestamp == null}">
    <article class="flash flash-success" role="status" th:if="${status}" th:text="${status}">
        Saved.
    </article>
    <article class="flash flash-error" role="alert" th:if="${error}" th:text="${error}">
        Something went wrong.
    </article>
</div>

<main class="container" th:replace="${content}">
    <p>The page content goes here.</p>
</main>

<footer class="container">
    <small>Billable</small>
</footer>

</body>
</html>
